name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    env:
      _JAVA_OPTIONS: "-Djava.awt.headless=true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure Environment and Keystore
        run: |
          # Create empty .env if missing to satisfy secrets gradle plugin
          touch .env

          # Restore debug keystore from base64 if present, otherwise generate it
          if [ -f debug.keystore.base64 ] && [ -s debug.keystore.base64 ]; then
            echo "Attempting to restore debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore || base64 --decode -i debug.keystore.base64 > debug.keystore || true
          fi

          if [ ! -f debug.keystore ] || [ ! -s debug.keystore ]; then
            echo "Generating fresh debug.keystore with keytool..."
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          chmod 644 debug.keystore
          ls -lh debug.keystore

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SecureVPN-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
